name: CI

on:
  push:
    branches: [main, quality-upgrade]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests main.py plots.py

      - name: Compile sources
        run: python -m compileall -q src main.py plots.py

      - name: Run tests
        run: python -m pytest

      - name: Check CLI entry points
        run: |
          scrna-expression-evaluate --help
          scrna-expression-plot-gene --help
          python main.py --help
          python plots.py --help

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build analysis container
        run: docker build -t scrna-expression-evaluation-ci .
