[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrna-expression-evaluation"
version = "0.2.0"
description = "Sample-level pseudobulk evaluation of disease-associated scRNA-seq expression."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10,<1",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
scrna-expression-evaluate = "scrna_expression_eval.cli:main"
scrna-expression-plot-gene = "scrna_expression_eval.plot_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "data", "outputs", "results", "plots"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]
